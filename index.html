<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Nau Quero</title>
<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-boneca-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./images/favicon-boneca-192.png">
<link rel="apple-touch-icon" href="./images/favicon-boneca-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500&family=Poppins:wght@300;400;500;600&family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Light.otf') format('opentype'); font-weight:300; font-style:normal; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Italic.otf') format('opentype'); font-weight:400; font-style:italic; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  @font-face { font-family:'The Seasons'; src:url('./fonts/TheSeasons-Bold.otf') format('opentype'); font-weight:500 700; font-style:normal; font-display:swap; unicode-range:U+0000-0025, U+0027-10FFFF; }
  body { margin:0; background:#690A20; overflow:hidden; }
  a { color:#F3E9D2; }
  a:hover { color:#D5DB89; }
  @keyframes nqNudge { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
  @keyframes nqSpin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes nqFloat { 0%,100% { transform:translateY(0) rotate(-0.8deg); } 50% { transform:translateY(-9px) rotate(0.8deg); } }
  @keyframes nqGlow { 0%,100% { box-shadow:0 10px 30px rgba(0,0,0,0.35), 0 0 0 6px rgba(243,233,210,0.18), 0 0 24px 2px rgba(210,232,255,0.35); } 50% { box-shadow:0 14px 34px rgba(0,0,0,0.35), 0 0 0 13px rgba(243,233,210,0.06), 0 0 46px 10px rgba(210,232,255,0.6); } }
  @keyframes nqShine { 0%,55% { left:-70%; } 100% { left:140%; } }
  @keyframes nqTwinkle { 0%,100% { opacity:0; transform:scale(0.2) rotate(0deg); } 50% { opacity:1; transform:scale(1) rotate(90deg); } }
  .nq-enter { position:relative; overflow:hidden; animation:nqFloat 3.4s ease-in-out infinite, nqGlow 3.4s ease-in-out infinite; transition:background .25s ease; }
  .nq-enter::after { content:''; position:absolute; top:0; left:-70%; width:40%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,0.85), transparent); transform:skewX(-20deg); animation:nqShine 3s ease-in-out infinite; pointer-events:none; }
  .nq-enter:hover { background:#FFFFFF !important; }
  .nq-spark { position:absolute; color:#D2E8FF; font-size:18px; line-height:1; pointer-events:none; animation:nqTwinkle 1.8s ease-in-out infinite; }
</style>
<script src="./ui-sound.js"></script>
</helmet>
<div style="position:relative; font-family:'Poppins',sans-serif; background:#690A20; color:#F3E9D2; height:100vh; height:100svh; min-height:480px; overflow:hidden;">
  <div style="position:absolute; inset:0; z-index:30; pointer-events:none; background:#F3E9D2; opacity:{{ veilOpacity }}; transition:opacity 1.4s ease .6s;"></div>
  <div ref="{{ stage }}" style="position:absolute; left:clamp(16px,5vw,72px); right:clamp(16px,5vw,72px); top:clamp(64px,9vh,96px); bottom:clamp(110px,22vh,200px); z-index:5; touch-action:none;"></div>

  <div style="position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0.02; background-image:url(&quot;data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%272.6%27%20numOctaves%3D%272%27%20seed%3D%273%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.96%200%200%200%200%200.88%200%200%200%200%200.72%2012%200%200%200%20-7.4399999999999995%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E&quot;), url(&quot;data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%272.4%27%20numOctaves%3D%272%27%20seed%3D%2711%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.08%200%200%200%200%200.03%200%200%200%200%200%2012%200%200%200%20-7.5600000000000005%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E&quot;), url(&quot;data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27300%27%20height%3D%27300%27%3E%3Cfilter%20id%3D%27n%27%20x%3D%270%27%20y%3D%270%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%273.5%27%20numOctaves%3D%272%27%20seed%3D%277%27%20stitchTiles%3D%27stitch%27%2F%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200.9%200%200%200%200%200.78%200%200%200%200%200.58%208%200%200%200%20-4.8%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27300%27%20height%3D%27300%27%20filter%3D%27url(%23n)%27%2F%3E%3C%2Fsvg%3E&quot;); background-size:300px 300px, 340px 340px, 260px 260px;"></div>

  <p style="position:absolute; left:0; right:0; bottom:clamp(86px,17vh,160px); z-index:11; margin:0; text-align:center; pointer-events:none; font-family:'Poppins',sans-serif; font-size:11px; letter-spacing:0.04em; color:#F3E9D2; opacity:{{ hintOpacity }}; transition:opacity .6s ease;">Desenha o caminho com o dedo, a partir da boneca</p>

  <div style="position:absolute; left:50%; top:50%; z-index:12; transform:translate(-50%,-50%); pointer-events:none;">
    <div style="position:relative; opacity:{{ enterOpacity }}; transform:scale({{ enterScale }}); transition:opacity .5s ease, transform .8s cubic-bezier(.34,1.56,.64,1);">
      <span class="nq-spark" style="left:-26px; top:-14px; animation-delay:0s;">✦</span>
      <span class="nq-spark" style="right:-24px; top:-20px; font-size:13px; animation-delay:.5s;">✦</span>
      <span class="nq-spark" style="left:-16px; bottom:-18px; font-size:12px; animation-delay:1s;">✦</span>
      <span class="nq-spark" style="right:-28px; bottom:-12px; animation-delay:1.4s;">✦</span>
      <button type="button" class="nq-enter" onClick="{{ enter }}" style="pointer-events:{{ enterPointer }}; background:#F3E9D2; color:#690A20; border:0; border-radius:999px; padding:16px 38px; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:500; font-size:clamp(15px,1.3vw,19px); letter-spacing:0.02em; line-height:1;">Entra!</button>
    </div>
  </div>

  <div style="position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(20px,3vw,44px) clamp(20px,5vw,72px);">
    <div style="display:flex; align-items:flex-start; justify-content:flex-end; gap:18px;">
      <img src="./images/nauquero-logo-brown.png" alt="NAU QUERO" style="height:clamp(20px,1.9vw,28px); width:auto; display:block; filter:brightness(0) invert(1) sepia(0.25) brightness(0.96);"></img>
    </div>

    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap;">
      <h1 style="font-family:'The Seasons','Petrona',Georgia,serif; font-weight:400; font-size:clamp(26px,8.6vw,128px); line-height:0.92; letter-spacing:-0.04em; margin:0; padding:0.3em 0; white-space:nowrap;">We don<span style="font-family:'Petrona',Georgia,serif;">’</span>t do <span style="font-style:italic; color:#D2E8FF;">vanilla.</span></h1>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { started: false, solved: false, diving: false };

  componentDidMount() {
    import('./maze.js').then(m => {
      if (!this._host) return;
      this._maze = m.initMaze(this._host, {
        iconSrc: './images/favicon-boneca-192.png',
        onStart: () => this.setState({ started: true }),
        onSolved: () => this.setState({ solved: true }),
      });
    });
    import('./dot-cursor.js').then(m => { this._dot = m.initDotCursor(); });
  }
  componentWillUnmount() {
    if (this._maze) this._maze.destroy();
    if (this._dot) this._dot();
  }

  renderVals() {
    const { started, solved, diving } = this.state;
    return {
      stage: el => { this._host = el; },
      hintOpacity: (started || solved) ? 0 : 0.85,
      enterOpacity: solved && !diving ? 1 : 0,
      enterScale: solved && !diving ? 1 : 0.4,
      enterPointer: solved && !diving ? 'auto' : 'none',
      veilOpacity: diving ? 1 : 0,
      enter: () => {
        if (this.state.diving || !this.state.solved) return;
        this.setState({ diving: true });
        setTimeout(() => { window.location.href = './home.html'; }, 1500);
      },
    };
  }
}
</script>
</body>
</html>
